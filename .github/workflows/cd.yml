name: CD - Deploy para Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar variáveis de ambiente
        run: |
          echo "APPLICATION=${{ secrets.APPLICATION }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "ORDER_API_URL=${{ secrets.ORDER_API_URL }}" >> $GITHUB_ENV

      - name: Rodar migrações Alembic
        run: |
          alembic upgrade head  # Aplica as migrações no ambiente de produção

#      - name: Fazer deploy para o ambiente de produção
#        run: |
#          # Exemplo de deploy utilizando AWS Elastic Beanstalk
#          eb init -p python-3.8 my-app --region $AWS_REGION
#          eb deploy

      - name: Notificar sucesso do deploy
        run: |
          echo "Deploy realizado com sucesso!"
